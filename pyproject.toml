[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "answersheet"
version = "0.1.0"
description = "选择题答题卡：按题量与选项数生成 A4 可打印答题卡"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "eastyou" }]
keywords = ["exam", "answer-sheet", "teacher", "education", "print", "cli"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Environment :: Console",
  "Topic :: Education",
]

[project.scripts]
answersheet = "answersheet.cli:main"

[project.urls]
Homepage = "https://github.com/eastyou/answersheet"
Source = "https://github.com/eastyou/answersheet"

[tool.setuptools]
packages = ["answersheet"]
